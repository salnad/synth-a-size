[package]
name = "sas-plugin"
description = "VST3 instrument wrapper around the synth-a-size engine, built on nice-plug."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later AND GPL-3.0-only"
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# nice-plug's logger: `nice_*!` and tracing output (including the editor's
# caught panics and wgpu errors) and panics go to STDERR, or where `NICE_LOG`
# says. Without it they are dropped.
nice-plug = { workspace = true, features = ["tracing-subscriber"] }
sas-common.workspace = true
sas-engine.workspace = true
sas-gui.workspace = true
# The LLM tools' live session and the chat (no network code here; see the
# macOS section below).
sas-llm-control.workspace = true
sas-llm-agent.workspace = true
# The chat's preview engine (the `audition` tool): a second synth, no network.
sas-llm-listen.workspace = true
sas-preset.workspace = true
# sas-engine's Tuning state is serde_json; already in the tree via nice-plug.
serde_json = "1"

# The chat's HTTPS (Security.framework, no OpenSSL) and the Keychain for its
# API key exist only in the macOS plugin, the shipping target.
[target.'cfg(target_os = "macos")'.dependencies]
sas-llm-agent = { workspace = true, features = ["http"] }
security-framework = "3"

[features]
# The G1 keyboard-focus check panel in the editor (FL Studio spike only).
focus-spike = ["sas-gui/focus-spike"]
# Upstream's aarch64 (NEON) semantics on every target; see
# migration/decisions/reference-arm.md.
aarch64-semantics = [
    "sas-common/aarch64-semantics",
    "sas-engine/aarch64-semantics",
    "sas-preset/aarch64-semantics",
]

[dev-dependencies]
sas-parity.workspace = true
