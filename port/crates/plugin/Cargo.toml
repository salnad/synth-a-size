[package]
name = "sas-plugin"
description = "VST3 instrument wrapper around the synth-a-size engine, built on nice-plug."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug.workspace = true
sas-common.workspace = true
sas-engine.workspace = true
sas-preset.workspace = true

[features]
# Upstream's aarch64 (NEON) semantics on every target; see
# migration/decisions/reference-arm.md.
aarch64-semantics = [
    "sas-common/aarch64-semantics",
    "sas-engine/aarch64-semantics",
    "sas-preset/aarch64-semantics",
]

[dev-dependencies]
serde_json = "1"
