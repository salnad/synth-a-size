[package]
name = "sas-filters"
description = "Filter models (analog, dirty, ladder, digital, diode, formant, comb, phaser) and building blocks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Upstream's aarch64 (NEON) semantics on every target; see sas-simd and
# migration/decisions/reference-arm.md.
aarch64-semantics = ["sas-dsp-core/aarch64-semantics", "sas-simd/aarch64-semantics"]

[dependencies]
sas-dsp-core.workspace = true
sas-simd.workspace = true

[dev-dependencies]
sas-parity.workspace = true
serde_json = "1"
