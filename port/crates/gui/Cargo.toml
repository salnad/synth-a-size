[package]
name = "sas-gui"
description = "Plugin editor: upstream's interface rebuilt with egui and wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
nice-plug = { workspace = true, features = ["editor"] }
nice-plug-egui.workspace = true
sas-engine.workspace = true
sas-preset.workspace = true
serde_json = "1"

[features]
# Adds the keyboard-focus check panel used for the FL Studio spike (G1). Not
# part of the shipped editor.
focus-spike = []

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
egui_kittest.workspace = true
