[package]
name = "sas-gui"
description = "Plugin editor: upstream's interface rebuilt with egui and wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
egui.workspace = true
egui-wgpu.workspace = true
nice-plug = { workspace = true, features = ["editor"] }
nice-plug-egui.workspace = true
sas-common.workspace = true
sas-engine.workspace = true
sas-filters.workspace = true
sas-simd.workspace = true
sas-preset.workspace = true
serde_json = "1"

[features]
# Adds the keyboard-focus check panel used for the FL Studio spike (G1). Not
# part of the shipped editor.
focus-spike = []
# Builds the tests that render through wgpu (tests/gpu.rs, tests/editor_gpu.rs).
# They need a GPU adapter (Mesa's lavapipe in CI's GUI reference job, Metal in
# the macOS VST3 job) and fail without one.
gpu-tests = []

[dev-dependencies]
keyboard-types = { version = "=0.8.3", default-features = false }
naga = { version = "30.0.1", features = ["wgsl-in"] }
egui_kittest.workspace = true
pollster = "=1.0.1"

[[test]]
name = "gpu"
required-features = ["gpu-tests"]

[[test]]
name = "editor_gpu"
required-features = ["gpu-tests"]
