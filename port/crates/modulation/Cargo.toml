[package]
name = "sas-modulation"
description = "Modulators (envelopes, LFOs, random LFOs, macros) and the modulation matrix."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Use upstream's aarch64 semantics on every target (the per-ISA sites of
# migration/decisions/reference-arm.md), so x86_64 developers can compare
# against macOS arm64 reference renders. No-op on aarch64.
aarch64-semantics = ["sas-simd/aarch64-semantics", "sas-common/aarch64-semantics"]

[dependencies]
sas-simd.workspace = true
sas-common.workspace = true
sas-dsp-core.workspace = true

[dev-dependencies]
sas-parity.workspace = true
serde_json = "1"
