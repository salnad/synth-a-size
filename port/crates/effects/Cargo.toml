[package]
name = "sas-effects"
description = "Effect chain: chorus, compressor, delay, distortion, EQ, filter FX, flanger, phaser, reverb."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Upstream's aarch64 (NEON) semantics at the per-ISA sites on every target
# (migration/decisions/reference-arm.md); for comparing against macOS arm64
# reference renders on x86_64. Forwarded to every direct dependency that has
# the feature, so all crates use the same column.
aarch64-semantics = [
    "sas-dsp-core/aarch64-semantics",
    "sas-filters/aarch64-semantics",
    "sas-simd/aarch64-semantics",
]

[dependencies]
sas-simd.workspace = true
sas-dsp-core.workspace = true
sas-filters.workspace = true

[dev-dependencies]
sas-parity.workspace = true
serde_json = "1"
