[package]
name = "sas-llm-control"
description = "LLM control layer: tools that read and edit the synth by parameter and modulation name, with validation, undo and a compact patch description."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sas-preset.workspace = true
# Tool arguments and results are JSON; both already in the tree via nice-plug.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
