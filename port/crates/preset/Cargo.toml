[package]
name = "sas-preset"
description = "Parameter registry (names, ranges, scales, defaults) and preset JSON load/save (upstream preset format) with version upgrades."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sas-common.workspace = true
sas-wavetable.workspace = true

[dev-dependencies]
sas-parity.workspace = true

[features]
# The aarch64 reference's semantics on every target (see sas-common's and
# sas-simd's features of the same name); forwarded to every dependency that
# has per-target behaviour.
aarch64-semantics = ["sas-common/aarch64-semantics", "sas-wavetable/aarch64-semantics"]
