[package]
name = "sas-preset"
description = "Parameter registry (names, ranges, scales, defaults) and preset JSON load/save (upstream preset format) with version upgrades."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sas-common.workspace = true
sas-wavetable.workspace = true

[features]
# Compute the upgrade chain with the formulas as written in the upstream
# source instead of mirroring the x86 GCC -ffast-math code the reference
# build emits (see src/arith.rs). Saved state then differs from the
# reference in the last bits for the affected upgrade steps.
source-formulas = []
