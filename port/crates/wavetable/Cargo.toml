[package]
name = "sas-wavetable"
description = "Wavetable data and the wavetable creator (sources, modifiers, keyframes, groups) with JSON state."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The aarch64 reference's semantics on every target (see sas-common's and
# sas-simd's features of the same name); forwarded to every dependency that
# has per-target behaviour.
aarch64-semantics = ["sas-common/aarch64-semantics"]

[dependencies]
sas-common.workspace = true
libm.workspace = true

[dev-dependencies]
sas-parity.workspace = true
