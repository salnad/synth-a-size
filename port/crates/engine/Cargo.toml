[package]
name = "sas-engine"
description = "Sound engine: voice handling, MIDI/MPE, tuning, full patch graph, offline render."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Upstream's aarch64 (NEON) semantics on every target; see
# migration/decisions/reference-arm.md.
aarch64-semantics = [
    "sas-simd/aarch64-semantics",
    "sas-dsp-core/aarch64-semantics",
    "sas-filters/aarch64-semantics",
    "sas-effects/aarch64-semantics",
    "sas-oscillators/aarch64-semantics",
    "sas-preset/aarch64-semantics",
    "sas-modulation/aarch64-semantics",
    "sas-common/aarch64-semantics",
]

[dependencies]
sas-common.workspace = true
sas-simd.workspace = true
sas-dsp-core.workspace = true
sas-oscillators.workspace = true
sas-filters.workspace = true
sas-effects.workspace = true
sas-modulation.workspace = true
sas-preset.workspace = true
serde_json = "1"
# Bounded lock-free queues for the edit bus (MIT/Apache-2.0; already in the
# tree through nice-plug).
crossbeam-queue = "0.3"

[dev-dependencies]
sas-parity.workspace = true
