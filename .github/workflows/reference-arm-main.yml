name: Reference ARM (main, full suite)

# Mac CI policy (owner approval 2026-10-21; migration/decisions/reference-arm.md,
# "Mac CI policy"). The full Apple Silicon suite runs on main, not per PR:
# - nightly, on manual dispatch, and on a push to main once at least 6 merges
#   have landed since the last run that executed it, or when the push changes
#   this workflow or its scripts (the `gate` job;
#   migration/scripts/mac_full_suite_gate.py);
# - jobs: the macOS 15 suite (pinned build, guard, repeat render, attribution
#   and build variants: vDSP, contraction, no-fast-math; the macOS
#   justification gate; arm64 parity on the whole workspace; strict hash
#   checks: a missing or changed macOS hash is an error), the same binary on
#   macOS 14 (Apple libm drift), the x86 baseline and the cross-platform report;
# - when the macOS 15 job fails only on missing macOS hash keys (no
#   mismatch, nothing else failed; scripts/mac_missing_only.py), the
#   `backfill` job opens or updates the hash-only PR from the bot branch
#   ci/macos-hashes-backfill (scripts/mac_hash_backfill.sh, new keys only)
#   and dispatches Linux CI on it; a human or agent merges it;
# - on a failure the `report` job opens or updates the issue "Mac full suite
#   failing on main" (linking the backfill PR), and closes it when main is
#   green again. Real mismatches keep failing and keep the issue open. When
#   only artifact upload/download steps failed, it says "infrastructure —
#   re-run" instead.

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aarch64_linux:
        description: Also build the optional aarch64 Linux proxy reference
        type: boolean
        default: false

concurrency:
  group: reference-arm-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Run the full suite now?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: python3 migration/scripts/mac_full_suite_gate.py --event "${{ github.event_name }}" --every 6 --before "$BEFORE" | tee -a "$GITHUB_OUTPUT"

  x86:
    name: x86_64 Linux reference (baseline for cross-ISA comparison)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build reference
        run: migration/scripts/build_reference.sh
      - name: Diagnostics
        run: migration/scripts/machine_info.sh build/platform/diag
      - name: Render corpus
        run: python3 migration/scripts/run_corpus.py render --out build/platform/pinned
      - name: Render attribution variants
        run: python3 migration/scripts/arm_attribution.py render --ref-render migration/reference/build/ref-render --out build/platform/attribution
      - uses: actions/upload-artifact@v7
        with:
          name: ref-x86_64-linux
          path: build/platform/
          if-no-files-found: error
          retention-days: 14

  macos-15:
    name: macOS 15 arm64 full suite
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    outputs:
      missing_only: ${{ steps.classify.outputs.missing_only }}
      reason: ${{ steps.classify.outputs.reason }}
    # Line tables keep panic backtraces readable at a fraction of full debug
    # info's size; debug-info level does not change generated code. Job-level
    # so rust-cache keys on it.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # The runner's free disk no longer fits the reference trees plus the
      # workspace's debug test build (run 40077324174 failed linking with
      # ENOSPC). The job never uses the preinstalled Android SDK.
      - name: Free disk space
        run: |
          df -h /
          for d in "$HOME/Library/Android" "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            if [ -n "$d" ] && [ -d "$d" ]; then sudo rm -rf "$d"; fi
          done
          df -h /
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            port
            migration/tools/audio-diff
      - name: Toolchain info
        run: |
          uname -m
          sw_vers
          clang++ --version | head -1
          cmake --version | head -1
          rustup toolchain install || rustup show
          cargo --version
      - name: Does the compiler honour -ffp-contract=off?
        id: contract_flags
        run: CXX=clang++ migration/scripts/fp_contract_flags_probe.sh
      - name: Build pinned reference
        id: build
        run: CXX=clang++ migration/scripts/build_reference.sh
      - name: No CPU-dependent floating-point instructions (estimates, FMA, vector math)
        id: guard
        run: migration/scripts/check_fp_determinism.sh
      - name: Diagnostics
        id: diag
        run: CXX=clang++ migration/scripts/machine_info.sh build/platform/diag
      - name: Render corpus and check repeatability
        id: render
        run: |
          python3 migration/scripts/run_corpus.py render --out build/platform/pinned
          python3 migration/scripts/run_corpus.py render --out build/platform/pinned-again
      - name: Build audio-diff
        id: audio_diff
        run: cargo build --release --locked --manifest-path migration/tools/audio-diff/Cargo.toml
      - name: Repeat render is bit-identical
        id: repeat
        run: python3 migration/scripts/run_corpus.py compare build/platform/pinned build/platform/pinned-again --exact
      - name: Render attribution variants
        id: attribution
        run: python3 migration/scripts/arm_attribution.py render --ref-render migration/reference/build/ref-render --out build/platform/attribution
      - name: Variant - JUCE FFT via Accelerate/vDSP (upstream Mac default)
        id: vdsp
        run: |
          REF_BUILD_DIR=build/variant-vdsp CXX=clang++ migration/scripts/build_reference.sh -DREF_USE_VDSP=ON
          python3 migration/scripts/run_corpus.py render --out build/platform/vdsp \
            --ref-render build/variant-vdsp/ref-render --ref-module build/variant-vdsp/ref-module
      - name: Variant - FP contraction allowed (Apple clang default)
        id: contract
        run: |
          REF_BUILD_DIR=build/variant-contract CXX=clang++ migration/scripts/build_reference.sh -DREF_FP_CONTRACT=ON
          python3 migration/scripts/run_corpus.py render --out build/platform/contract \
            --ref-render build/variant-contract/ref-render --ref-module build/variant-contract/ref-module
      - name: Variant - no fast-math (faithful-port proxy)
        id: proxy
        run: |
          REF_BUILD_DIR=build/variant-proxy CXX=clang++ migration/scripts/build_reference.sh -DREF_FAST_MATH=OFF
          python3 migration/scripts/run_corpus.py render --out build/platform/proxy \
            --ref-render build/variant-proxy/ref-render --ref-module build/variant-proxy/ref-module
      # A "reference": "nofastmath" case qualifies if the official reference
      # fails its normal limits on x86 or on macOS (SAS-35). This step gates
      # the cases declared "macos"; ci.yml gates those declared "x86". Cases
      # in parked_arm64.json are skipped (and listed) here and in the hash
      # checks below; x86 keeps them live.
      - name: Tolerances are achievable on macOS arm64 (proxy must pass; macOS no-fast-math justification)
        id: justify
        run: migration/scripts/justify_nofastmath_summary.sh build/platform/pinned build/platform/proxy
      - name: arm64 parity tests on the whole workspace (NEON path)
        id: parity
        if: ${{ !cancelled() }}
        env:
          SAS_PARITY_CAPTURES: build/platform/pinned
          SAS_PARITY_CAPTURES_NOFASTMATH: build/platform/proxy
          SAS_PARITY_NO_BUILD: "1"
          SAS_PARITY_FAILURES: ${{ github.workspace }}/build/parity-failures
          SAS_PARITY_PARKED: ${{ github.workspace }}/migration/corpus/parked_arm64.json
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast --manifest-path port/Cargo.toml 2>&1 | tee build/parity.log
      - name: Disk left after the parity build
        if: ${{ !cancelled() }}
        run: df -h / && du -sh port/target build/platform 2>/dev/null || true
      # Strict on main: a missing or changed macOS hash is an error.
      - name: Hashes match the committed macOS arm64 identity
        id: hashes
        if: ${{ !cancelled() }}
        # Both checks always run and report; the step fails if either does.
        run: |
          set -o pipefail
          status=0
          python3 migration/scripts/run_corpus.py hashes build/platform/pinned --check --require-known-identity \
            --parked migration/corpus/parked_arm64.json | tee build/hash-pinned.txt || status=1
          python3 migration/scripts/run_corpus.py hashes build/platform/proxy --check --require-known-identity \
            --reference nofastmath --parked migration/corpus/parked_arm64.json | tee build/hash-nofastmath.txt || status=1
          exit $status
      - name: Write the missing macOS hash entries (new keys only) for the fix PR
        id: write
        if: failure()
        run: |
          python3 migration/scripts/run_corpus.py hashes build/platform/pinned --write --only-new \
            --parked migration/corpus/parked_arm64.json || true
          python3 migration/scripts/run_corpus.py hashes build/platform/proxy --write --only-new \
            --reference nofastmath --parked migration/corpus/parked_arm64.json || true
          mkdir -p build/macos-hashes
          git diff -- migration/corpus > build/macos-hashes/macos-hashes.patch
          if [ -s build/macos-hashes/macos-hashes.patch ]; then echo "written=true" >> "$GITHUB_OUTPUT"; fi
      # Missing keys only (no mismatch, nothing else failed) -> the backfill
      # job opens or updates the hash-only PR; anything else stays a failure.
      - name: Classify the failure (missing macOS hash keys only?)
        id: classify
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 migration/scripts/mac_missing_only.py --steps-json "$STEPS" \
            --hash-log build/hash-pinned.txt --hash-log build/hash-nofastmath.txt \
            --parity-log build/parity.log --patch build/macos-hashes/macos-hashes.patch | tee -a "$GITHUB_OUTPUT"
      - name: Upload the macOS hash patch
        if: ${{ failure() && steps.write.outputs.written == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-hashes
          path: build/macos-hashes/
          retention-days: 14
      - name: Upload parity failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-failures-arm64-macos
          path: build/parity-failures/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ref-arm64-macos-15
          path: |
            build/platform/
            migration/reference/build/ref-render
            migration/reference/build/ref-module
            migration/reference/build/ref-fp-probe
            migration/reference/build/ref-rng-probe
            migration/reference/build/ref-complex-probe
          if-no-files-found: error
          retention-days: 14
      # Only what the macOS 14 job reads: the binaries and the pinned tree it
      # compares against. The full artifact also carries every variant tree,
      # and downloading it on macOS runners has failed after retries.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ref-arm64-macos-15-binary
          path: |
            build/platform/pinned/
            migration/reference/build/ref-render
            migration/reference/build/ref-module
            migration/reference/build/ref-fp-probe
            migration/reference/build/ref-rng-probe
            migration/reference/build/ref-complex-probe
          if-no-files-found: error
          retention-days: 14

  macos-14:
    name: macOS 14 (same binary as macOS 15; Apple clang 15 diagnostics)
    needs: macos-15
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration/tools/audio-diff
      - name: Toolchain info
        run: |
          sw_vers
          clang++ --version | head -1
          rustup toolchain install || rustup show
      - uses: actions/download-artifact@v8
        with:
          name: ref-arm64-macos-15-binary
          path: build/from-macos-15
      - name: Diagnostics for the macOS 15 binary running on macOS 14
        run: |
          chmod +x build/from-macos-15/migration/reference/build/ref-*
          REF_BUILD_DIR=build/from-macos-15/migration/reference/build CXX=clang++ \
            migration/scripts/machine_info.sh build/platform/diag
      - name: Render corpus with the macOS 15 binary
        run: |
          bin=build/from-macos-15/migration/reference/build
          python3 migration/scripts/run_corpus.py render --out build/platform/same-binary \
            --ref-render $bin/ref-render --ref-module $bin/ref-module
      - name: Build audio-diff
        run: cargo build --release --locked --manifest-path migration/tools/audio-diff/Cargo.toml
      # Exact, except the committed list of known Apple libm drift cases
      # (migration/corpus/macos_libm_drift.json), which are reported with
      # their metrics. Any other difference fails.
      - name: Same binary on macOS 14 vs macOS 15 is bit-identical (OS / Apple libm drift)
        run: |
          python3 migration/scripts/compare_known_drift.py \
            build/from-macos-15/build/platform/pinned build/platform/same-binary \
            migration/corpus/macos_libm_drift.json
      - name: Does Apple clang 15 honour -ffp-contract=off?
        run: CXX=clang++ migration/scripts/fp_contract_flags_probe.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ref-arm64-macos-14
          path: build/platform/
          if-no-files-found: error
          retention-days: 14

  arm-linux:
    name: aarch64 Linux proxy reference (GCC, optional)
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name == 'workflow_dispatch' && inputs.aarch64_linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust if missing
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Toolchain info
        run: |
          g++ --version | head -1
          rustup toolchain install || rustup show
      - name: Build pinned reference
        run: migration/scripts/build_reference.sh
      - name: No CPU-dependent floating-point instructions
        run: migration/scripts/check_fp_determinism.sh
      - name: Diagnostics
        run: migration/scripts/machine_info.sh build/platform/diag
      - name: Render corpus
        run: python3 migration/scripts/run_corpus.py render --out build/platform/pinned
      - name: Variant - FP contraction allowed (GCC default on aarch64)
        run: |
          REF_BUILD_DIR=build/variant-contract migration/scripts/build_reference.sh -DREF_FP_CONTRACT=ON
          python3 migration/scripts/run_corpus.py render --out build/platform/contract \
            --ref-render build/variant-contract/ref-render --ref-module build/variant-contract/ref-module
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ref-aarch64-linux
          path: build/platform/
          if-no-files-found: error
          retention-days: 14

  cross-isa:
    name: Cross-platform reference comparison (report)
    needs: [gate, x86, macos-15, macos-14, arm-linux]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' && needs.x86.result == 'success' && needs.macos-15.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration/tools/audio-diff
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: Build audio-diff
        run: cargo build --release --locked --manifest-path migration/tools/audio-diff/Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          path: build/artifacts
      - name: Compare
        run: |
          a=build/artifacts
          m=$a/ref-arm64-macos-15/build/platform
          python3 migration/scripts/cross_platform_report.py --out build/cross \
            --pair "macOS 15 arm64 vs x86_64 Linux=$a/ref-x86_64-linux/pinned:$m/pinned" \
            --pair "macOS 14 (same binary) vs macOS 15=$m/pinned:$a/ref-arm64-macos-14/same-binary" \
            --pair "macOS contraction on vs off=$m/pinned:$m/contract" \
            --pair "macOS vDSP FFT vs fallback FFT=$m/pinned:$m/vdsp" \
            --pair "macOS no-fast-math proxy=$m/pinned:$m/proxy" \
            --pair "aarch64 Linux vs macOS 15=$m/pinned:$a/ref-aarch64-linux/pinned" \
            --pair "aarch64 Linux vs x86_64 Linux=$a/ref-x86_64-linux/pinned:$a/ref-aarch64-linux/pinned" \
            --probe-pair "x86_64 Linux vs macOS 15 arm64=$a/ref-x86_64-linux/diag:$m/diag" \
            --probe-pair "macOS 15 vs macOS 14 (same binaries)=$m/diag:$a/ref-arm64-macos-14/diag"
          python3 migration/scripts/arm_attribution.py compare $a/ref-x86_64-linux/attribution $m/attribution \
            --audio-diff migration/tools/audio-diff/target/release/audio-diff --markdown build/cross/attribution.md
          cat build/cross/report.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo "### Attribution: macOS 15 arm64 vs x86_64 Linux"; cat build/cross/attribution.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-platform-report
          path: build/cross/
          retention-days: 14

  backfill:
    name: Open or update the macOS hash backfill PR (missing keys only)
    needs: [gate, macos-15]
    if: ${{ always() && needs.macos-15.result == 'failure' && needs.macos-15.outputs.missing_only == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: macos-hashes
          path: build/macos-hashes
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: migration/scripts/mac_hash_backfill.sh build/macos-hashes/macos-hashes.patch | tee -a "$GITHUB_OUTPUT"

  report:
    name: Report to the coordinator (issue on failure)
    needs: [gate, x86, macos-15, macos-14, cross-isa, backfill]
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open, update or close the "Mac full suite failing on main" issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          MISSING_ONLY_REASON: ${{ needs.macos-15.outputs.reason }}
          BACKFILL_PR: ${{ needs.backfill.outputs.pr }}
        run: python3 migration/scripts/mac_full_suite_report.py
