name: Plugin

# The shipping build: an Apple Silicon (arm64) macOS VST3 for FL Studio
# (port plan, owner decision of 2026-10-20). Builds sas-plugin for
# aarch64-apple-darwin only, bundles it, signs it ad hoc, checks it is
# arm64-only, runs Steinberg's VST3 validator on it, plays a note through
# it in a minimal VST3 host (port/crates/plugin/vst3-smoke) to check it makes
# sound, and opens its editor in a real window in the same kind of host. It
# also draws the editor on Metal through the window's render-state path
# (sas-gui's editor_gpu test). The plugin's Rust
# tests run with the rest of the workspace in ci.yml (Linux) and in
# reference-arm.yml (macOS arm64).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # MIT-licensed since 3.8.0; only CI tools are built from it (validator, sound check).
  VST3_SDK_TAG: v3.8.0_build_66

jobs:
  vst3-macos-arm64:
    name: arm64 macOS VST3 (bundle, ad-hoc signature, VST3 validator, sound check, editor)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
          key: plugin-aarch64-apple-darwin
      - name: Toolchain info
        run: |
          uname -m
          sw_vers
          rustup toolchain install || rustup show
          cargo --version
      - name: Build, bundle and sign the arm64 VST3
        run: port/crates/plugin/scripts/bundle.sh build/plugin
      - name: Bundle exports the VST3 entry points
        run: |
          binary=build/plugin/synth-a-size.vst3/Contents/MacOS/synth-a-size
          file "$binary"
          for symbol in GetPluginFactory bundleEntry bundleExit; do
            nm -gU "$binary" | grep -q " _$symbol\$" || { echo "missing $symbol"; exit 1; }
          done
      # The only job that compiles the chat's network code (sas-llm-agent's
      # `http` feature), so its transport test runs here: a stoppable HTTPS
      # request against a local listener that never answers. No real API.
      - name: Chat transport stops a pending HTTPS request
        run: cargo test --locked --manifest-path port/Cargo.toml -p sas-llm-agent --features http --test stop
      # The editor's render state and every tab drawn on the runner's Metal
      # device, as the plugin window creates them (default GraphicsConfig),
      # and the quad shaders' pixel tests on Metal.
      - name: Editor draws on Metal without wgpu errors (sas-gui editor_gpu, gpu)
        run: cargo test --locked --manifest-path port/Cargo.toml -p sas-gui --features gpu-tests --test editor_gpu --test gpu -- --nocapture
      - name: Cache the VST3 tools
        id: vst3-tools-cache
        uses: actions/cache@v4
        with:
          path: build/vst3-tools-bin
          key: vst3-tools-macos-15-arm64-${{ env.VST3_SDK_TAG }}-${{ hashFiles('port/crates/plugin/vst3-smoke/**') }}
      - name: Build the VST3 validator, sound check and editor check
        if: steps.vst3-tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3sdk build/vst3sdk
          git -C build/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          cmake -S port/crates/plugin/vst3-smoke -B build/vst3-tools \
            -DVST3_SDK_ROOT="$PWD/build/vst3sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vst3-tools --target vst3-smoke vst3-editor-smoke validator --config Release -j "$(sysctl -n hw.ncpu)"
          mkdir -p build/vst3-tools-bin
          for tool in validator vst3-smoke vst3-editor-smoke; do
            cp "$(find build/vst3-tools -type f -name "$tool" -perm -u+x | head -1)" "build/vst3-tools-bin/$tool"
          done
      - name: VST3 validator (extensive)
        run: |
          set -o pipefail
          build/vst3-tools-bin/validator -e build/plugin/synth-a-size.vst3 | tee build/plugin/validator.log
      # The validator checks API conformance, not audio: load the bundle like
      # a host, play a note and fail if the output stays silent.
      - name: VST3 sound check (a note makes sound)
        run: |
          set -o pipefail
          build/vst3-tools-bin/vst3-smoke build/plugin/synth-a-size.vst3 --min-peak 0.01 | tee build/plugin/sound-check.log
      # Neither check above creates the editor view: attach it to an NSWindow
      # like a host, let it draw, close it, and check the plugin's log.
      - name: VST3 editor opens, draws and closes
        run: |
          port/crates/plugin/scripts/editor_smoke.sh build/vst3-tools-bin/vst3-editor-smoke \
            build/plugin/synth-a-size.vst3 build/plugin/editor-smoke.log
      - uses: actions/upload-artifact@v7
        with:
          name: synth-a-size-vst3-arm64-macos
          path: build/plugin/
          if-no-files-found: error
          retention-days: 14
      # G1 spike: the same plugin with the editor's keyboard-focus check panel,
      # for testing text entry in FL Studio. Same plugin ID, so install it in
      # place of the normal bundle while testing. Not shipped.
      - name: Build the keyboard-focus check bundle
        env:
          SAS_PLUGIN_FEATURES: focus-spike
        run: port/crates/plugin/scripts/bundle.sh build/plugin-focus-check
      - uses: actions/upload-artifact@v7
        with:
          name: synth-a-size-vst3-arm64-macos-focus-check
          path: build/plugin-focus-check/
          if-no-files-found: error
          retention-days: 14

  # Gating counterpart of the macOS job (macOS CI is non-gating by owner
  # policy): the same validator, sound check and editor check (X11 under Xvfb,
  # Mesa's lavapipe) on the x86_64 Linux dev bundle, which is only for testing
  # and never shipped.
  vst3-linux-dev:
    name: Linux dev VST3 (VST3 validator, sound check, editor; not shipped)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
          key: plugin-linux-dev
      - name: Install the editor check's dependencies (X11, Xvfb, lavapipe)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev xvfb libgl1-mesa-dri mesa-vulkan-drivers
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: Build the dev bundle
        run: port/crates/plugin/scripts/bundle.sh build/plugin
      - name: Cache the VST3 tools
        id: vst3-tools-cache
        uses: actions/cache@v4
        with:
          path: build/vst3-tools-bin
          key: vst3-tools-ubuntu-24.04-${{ env.VST3_SDK_TAG }}-${{ hashFiles('port/crates/plugin/vst3-smoke/**') }}
      - name: Build the VST3 validator, sound check and editor check
        if: steps.vst3-tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$VST3_SDK_TAG" https://github.com/steinbergmedia/vst3sdk build/vst3sdk
          git -C build/vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk cmake
          CC=gcc CXX=g++ cmake -S port/crates/plugin/vst3-smoke -B build/vst3-tools \
            -DVST3_SDK_ROOT="$PWD/build/vst3sdk" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vst3-tools --target vst3-smoke vst3-editor-smoke validator -j "$(nproc)"
          mkdir -p build/vst3-tools-bin
          for tool in validator vst3-smoke vst3-editor-smoke; do
            cp "$(find build/vst3-tools -type f -name "$tool" -perm -u+x | head -1)" "build/vst3-tools-bin/$tool"
          done
      - name: VST3 validator (extensive)
        run: |
          set -o pipefail
          build/vst3-tools-bin/validator -e build/plugin/synth-a-size.vst3 | tee build/plugin/validator.log
      - name: VST3 sound check (a note makes sound)
        run: |
          set -o pipefail
          build/vst3-tools-bin/vst3-smoke build/plugin/synth-a-size.vst3 --min-peak 0.01 | tee build/plugin/sound-check.log
      - name: VST3 editor opens, draws and closes (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" port/crates/plugin/scripts/editor_smoke.sh \
            build/vst3-tools-bin/vst3-editor-smoke build/plugin/synth-a-size.vst3 build/plugin/editor-smoke.log
      - name: sas-render renders a corpus preset
        run: |
          cargo run --release --locked -p sas-plugin --bin sas-render --manifest-path port/Cargo.toml -- \
            migration/corpus/presets/unison_pad_fx.vital migration/corpus/midi/chord_progression.mid \
            -o build/sas-render/unison_pad_fx__chords.wav --sample-rate 48000 --block-size 128 --seed 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vst3-linux-dev-logs
          path: |
            build/plugin/validator.log
            build/plugin/sound-check.log
            build/plugin/editor-smoke.log
          if-no-files-found: ignore
          retention-days: 14
