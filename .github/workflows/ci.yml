name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-checks:
    name: Repo checks (upstream copy, names, corpus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No-fast-math allowlist additions are loaded reference "nofastmath" cases citing a pinned approval
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 migration/scripts/run_corpus.py allowlist-approval --base "$BASE"
      - name: Ledger entries are well formed
        run: python3 migration/scripts/ledger.py --check
      # Pull requests only: an older PR that still appended to LEDGER.md must
      # not turn main red when it is merged.
      - name: migration/LEDGER.md is frozen (new entries go in migration/ledger/)
        if: github.event_name == 'pull_request'
        run: python3 migration/scripts/ledger.py --check-frozen --base "origin/${{ github.base_ref }}"
      - name: vital/ is an unmodified upstream copy
        run: migration/scripts/verify_upstream.sh
      - name: No upstream names in product metadata
        run: migration/scripts/check_names.sh
      - name: Corpus files match generate.py
        run: python3 migration/corpus/generate.py --check
      - name: run_corpus.py regression tests
        run: python3 -m unittest discover -s migration/scripts -p 'test_*.py' -v

  reference-harness:
    name: Reference harness (build + render corpus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration/tools/audio-diff
      - name: Toolchain info
        run: |
          g++ --version | head -1
          cmake --version | head -1
          rustup toolchain install || rustup show
          cargo --version
      - name: Build reference harness
        run: migration/scripts/build_reference.sh
      - name: Build audio-diff
        run: cargo build --release --locked --manifest-path migration/tools/audio-diff/Cargo.toml
      - name: Machine and build diagnostics
        run: migration/scripts/machine_info.sh build/diag
      - name: No CPU-dependent floating-point instructions in the reference
        run: migration/scripts/check_fp_determinism.sh
      - name: Render one preset through the CLI
        run: |
          mkdir -p build/smoke
          migration/reference/build/ref-render \
            migration/corpus/presets/analog_filter_lfo.vital \
            migration/corpus/midi/chord_progression.mid \
            -o build/smoke/analog_filter_lfo__chord_progression.wav \
            --sample-rate 48000 --block-size 128 --seed 1
          cat build/smoke/analog_filter_lfo__chord_progression.wav.json
      - name: Render corpus
        run: python3 migration/scripts/run_corpus.py render --out build/ref
      - name: Determinism (second render must be bit-identical)
        run: |
          python3 migration/scripts/run_corpus.py render --out build/ref-again
          python3 migration/scripts/run_corpus.py compare build/ref build/ref-again --exact
      - name: Cross-machine determinism (hashes must match the committed ones)
        run: python3 migration/scripts/run_corpus.py hashes build/ref --check --require-known-identity
      - name: Comparison tool rejects a different render
        run: |
          set +e
          migration/tools/audio-diff/target/release/audio-diff \
            build/ref/renders/init_saw__single_note.wav \
            build/ref/renders/init_saw__single_note.wav --max-abs-error 0
          same=$?
          migration/tools/audio-diff/target/release/audio-diff \
            build/ref/renders/init_saw__chords.wav \
            build/ref/renders/analog_filter_lfo__chords.wav --residual-db -60
          different=$?
          echo "identical exit=$same, different exit=$different"
          test "$same" -eq 0 && test "$different" -eq 1
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-renders
          path: |
            build/smoke/
            build/ref/renders/
            build/ref/modules/
          if-no-files-found: error
          retention-days: 14
      - name: Upload parity captures (consumed by the parity job)
        uses: actions/upload-artifact@v7
        with:
          name: parity-captures
          path: build/ref/
          if-no-files-found: error
          retention-days: 14
      - name: Upload reference binaries and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-binaries
          path: |
            migration/reference/build/ref-render
            migration/reference/build/ref-module
            migration/reference/build/ref-fp-probe
            build/diag/
          if-no-files-found: error
          retention-days: 14

  tolerance-calibration:
    name: Tolerances are achievable (no-fast-math reference must pass)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration/tools/audio-diff
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: Build reference (default) and a no-fast-math variant
        run: |
          migration/scripts/build_reference.sh
          REF_BUILD_DIR=build/ref-no-fast-math migration/scripts/build_reference.sh -DREF_FAST_MATH=OFF
      - name: Build audio-diff
        run: cargo build --release --locked --manifest-path migration/tools/audio-diff/Cargo.toml
      - name: Render both
        run: |
          python3 migration/scripts/run_corpus.py render --out build/ref
          python3 migration/scripts/run_corpus.py render --out build/proxy \
            --ref-render build/ref-no-fast-math/ref-render --ref-module build/ref-no-fast-math/ref-module
      # Also the owner's no-fast-math gate (SAS-35): every "reference":
      # "nofastmath" case whose allowlist line declares "x86" must fail its
      # normal limits here, or it is rejected; reference-arm.yml gates the
      # cases declared "macos" (migration/decisions/nofastmath/README.md).
      - name: Proxy for a faithful port passes the corpus tolerances
        run: python3 migration/scripts/run_corpus.py compare build/ref build/proxy --justify-nofastmath
      - name: No-fast-math captures match their committed hashes
        run: python3 migration/scripts/run_corpus.py hashes build/proxy --check --require-known-identity --reference nofastmath
      - name: Upload no-fast-math parity captures (consumed by the parity job)
        uses: actions/upload-artifact@v7
        with:
          name: parity-captures-nofastmath
          path: build/proxy/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust (port workspace + migration tools)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            port
            migration/tools/audio-diff
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: rustfmt
        run: |
          cargo fmt --all --check --manifest-path port/Cargo.toml
          cargo fmt --all --check --manifest-path migration/tools/audio-diff/Cargo.toml
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets --locked --manifest-path port/Cargo.toml -- -D warnings
          cargo clippy --all-targets --locked --manifest-path migration/tools/audio-diff/Cargo.toml -- -D warnings
      - name: cargo build --workspace
        run: cargo build --workspace --locked --manifest-path port/Cargo.toml
      - name: audio-diff tests
        run: cargo test --locked --manifest-path migration/tools/audio-diff/Cargo.toml

  # Upstream's interface as the editor's reference (migration/reference/gui).
  # The layout fixtures sas-gui's tests read must match what upstream's own
  # layout code produces; the screenshots of both editors are uploaded for
  # side-by-side review. Upstream's frames show its branding, so they stay
  # in the artifact and are never committed.
  gui-reference:
    name: GUI reference (upstream layout fixtures, side-by-side screenshots)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
          key: gui-gallery
      - name: Install GUI build and render dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libfreetype-dev libgl-dev libx11-dev libxext-dev libxinerama-dev \
            libxcursor-dev libxrandr-dev xvfb libgl1-mesa-dri mesa-vulkan-drivers imagemagick
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: Build ref-gui (upstream's interface)
        run: python3 migration/scripts/gui_reference.py build
      - name: Layout fixtures match upstream (migration/corpus/gui/layout)
        run: python3 migration/scripts/gui_reference.py layout --check
      - name: Render upstream's views
        run: python3 migration/scripts/gui_reference.py frames --out build/gui/upstream
      - name: Render the port's views
        run: cargo run --locked --release -p sas-gui --example gallery --manifest-path port/Cargo.toml -- build/gui/port
      - name: sas-gui tests that render through wgpu (ignored where there is no GPU adapter)
        run: cargo test --locked --release -p sas-gui --manifest-path port/Cargo.toml -- --ignored
      - name: Side-by-side images (upstream on top)
        run: |
          mkdir -p build/gui/side-by-side
          for upstream in build/gui/upstream/*.png; do
            name="$(basename "$upstream")"
            convert "$upstream" "build/gui/port/$name" -append "build/gui/side-by-side/$name"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gui-gallery
          path: build/gui/
          if-no-files-found: error
          retention-days: 14

  parity:
    name: Port tests incl. parity (cargo test --workspace against reference captures)
    needs: [reference-harness, tolerance-calibration]
    runs-on: ubuntu-24.04
    env:
      SAS_PARITY_CAPTURES: build/parity
      SAS_PARITY_CAPTURES_NOFASTMATH: build/parity-nofastmath
      # Captures come from the reference job; never rebuild them here.
      SAS_PARITY_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: Download reference captures
        uses: actions/download-artifact@v7
        with:
          name: parity-captures
          path: build/parity
      - name: Download no-fast-math captures
        uses: actions/download-artifact@v7
        with:
          name: parity-captures-nofastmath
          path: build/parity-nofastmath
      - name: cargo test --workspace
        run: cargo test --workspace --locked --manifest-path port/Cargo.toml
      - name: Upload parity failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-failures
          path: build/parity-failures/
          if-no-files-found: ignore
          retention-days: 14

  simd-aarch64-semantics:
    name: sas-simd with aarch64 semantics on x86_64 (feature aarch64-semantics)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: port
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install || rustup show
          cargo --version
      - name: clippy
        run: cargo clippy -p sas-simd --all-targets --locked --features aarch64-semantics --manifest-path port/Cargo.toml -- -D warnings
      # The parity test needs arm64 captures (macOS job); everything else runs here.
      - name: Tests (arm64 semantics through the scalar NEON model)
        run: >
          cargo test -p sas-simd --locked --features aarch64-semantics --manifest-path port/Cargo.toml
          --lib --test semantics --test backend_parity --test poly_utils --test futils --test futils_mono_vs_poly --test common_scalar
      # sas-common's libc++ RNG column (A9); its parity test needs reference captures.
      - name: sas-common clippy (aarch64-semantics)
        run: cargo clippy -p sas-common --all-targets --locked --features aarch64-semantics --manifest-path port/Cargo.toml -- -D warnings
      - name: sas-common tests (libc++ RNG column)
        run: cargo test -p sas-common --locked --features aarch64-semantics --manifest-path port/Cargo.toml --lib
      - name: sas-dsp-core clippy and tests (aarch64-semantics)
        run: |
          cargo clippy -p sas-dsp-core --all-targets --locked --features aarch64-semantics --manifest-path port/Cargo.toml -- -D warnings
          cargo test -p sas-dsp-core --locked --features aarch64-semantics --manifest-path port/Cargo.toml --lib --test graph
      - name: sas-simd rejects sas-common's feature without its own
        run: |
          if cargo check -p sas-simd --locked --features sas-common/aarch64-semantics --manifest-path port/Cargo.toml 2> check.log; then
            echo "sas-simd compiled with sas-common on the aarch64 column and itself on SSE2"; exit 1
          fi
          grep -q "aarch64-semantics is enabled on sas-common but not on sas-simd" check.log
      # sas-wavetable's aarch64 column (A12, the warp's expf); parity tests need reference captures.
      - name: sas-wavetable clippy (aarch64-semantics)
        run: cargo clippy -p sas-wavetable --all-targets --locked --features aarch64-semantics --manifest-path port/Cargo.toml -- -D warnings
      - name: sas-wavetable tests (aarch64-semantics)
        run: cargo test -p sas-wavetable --locked --features aarch64-semantics --manifest-path port/Cargo.toml --lib
