name: Reference ARM (PR, advisory)

# Mac CI policy (owner approval 2026-10-21; migration/decisions/reference-arm.md,
# "Mac CI policy"). macOS does not gate merges: they go on Linux CI plus
# review. This per-PR job is advisory and runs on macOS 15 only:
# - builds the macOS reference and checks that a repeat render is identical;
# - runs the arm64 (NEON) parity tests for the port crates the PR touches,
#   plus their dependents (everything when a shared input changes; see
#   migration/scripts/mac_pr_scope.py);
# - checks the macOS hashes. A changed output fails. A missing hash (a new
#   case or module) is only a warning here; on main it is an error
#   (reference-arm-main.yml);
# - writes the missing macOS hash entries, new keys only, as the
#   `macos-hashes` patch artifact (apply: migration/scripts/macos_hashes.sh);
# - runs the macOS no-fast-math justification whenever the no-fast-math
#   tree is built (always when the PR adds or edits a `macos` allowlist line),
#   with its result in the step summary.
# The full suite (build variants, macOS 14 drift, cross-platform report) runs
# on main: reference-arm-main.yml.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: reference-arm-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-15:
    name: macOS 15 arm64 reference and parity (advisory)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            port
            migration/tools/audio-diff
      - name: Toolchain info
        run: |
          sw_vers
          clang++ --version | head -1
          rustup toolchain install || rustup show
          cargo --version
      - name: Scope (crates to test, justification)
        id: scope
        run: python3 migration/scripts/mac_pr_scope.py "${{ github.event.pull_request.base.sha || 'origin/main' }}" | tee -a "$GITHUB_OUTPUT"
      - name: Build pinned reference
        run: CXX=clang++ migration/scripts/build_reference.sh
      - name: No CPU-dependent floating-point instructions (estimates, FMA, vector math)
        run: migration/scripts/check_fp_determinism.sh
      - name: Render corpus twice
        run: |
          python3 migration/scripts/run_corpus.py render --out build/platform/pinned
          python3 migration/scripts/run_corpus.py render --out build/platform/pinned-again
      - name: Build audio-diff
        run: cargo build --release --locked --manifest-path migration/tools/audio-diff/Cargo.toml
      - name: Repeat render is bit-identical
        run: python3 migration/scripts/run_corpus.py compare build/platform/pinned build/platform/pinned-again --exact
      - name: Build and render the no-fast-math reference
        if: steps.scope.outputs.proxy == 'true'
        run: |
          REF_BUILD_DIR=build/variant-proxy CXX=clang++ migration/scripts/build_reference.sh -DREF_FAST_MATH=OFF
          python3 migration/scripts/run_corpus.py render --out build/platform/proxy \
            --ref-render build/variant-proxy/ref-render --ref-module build/variant-proxy/ref-module
      # Evidence for `macos` allowlist declarations (SAS-35): each declared
      # case's official macOS reference must fail its normal limits against
      # no-fast-math. Runs whenever the no-fast-math tree is built, so a
      # corpus or reference change that un-justifies a case fails here too.
      # The result goes to the step summary for reviewers to cite.
      - name: macOS no-fast-math justification
        if: steps.scope.outputs.proxy == 'true'
        run: migration/scripts/justify_nofastmath_summary.sh build/platform/pinned build/platform/proxy
      - name: arm64 parity tests (${{ steps.scope.outputs.cargo_args || 'none' }})
        if: ${{ !cancelled() && steps.scope.outputs.cargo_args != '' }}
        env:
          SAS_PARITY_CAPTURES: build/platform/pinned
          SAS_PARITY_CAPTURES_NOFASTMATH: build/platform/proxy
          SAS_PARITY_NO_BUILD: "1"
          SAS_PARITY_MISSING_HASHES: warn
          SAS_PARITY_FAILURES: ${{ github.workspace }}/build/parity-failures
          SAS_PARITY_PARKED: ${{ github.workspace }}/migration/corpus/parked_arm64.json
        run: cargo test --locked --no-fail-fast ${{ steps.scope.outputs.cargo_args }} --manifest-path port/Cargo.toml
      - name: macOS hashes (a changed output fails; a missing hash is a warning)
        if: ${{ !cancelled() }}
        # Both checks always run and report; the step fails if either does.
        run: |
          status=0
          python3 migration/scripts/run_corpus.py hashes build/platform/pinned --check --require-known-identity \
            --missing-ok --parked migration/corpus/parked_arm64.json || status=1
          if [ -d build/platform/proxy ]; then
            python3 migration/scripts/run_corpus.py hashes build/platform/proxy --check --require-known-identity \
              --missing-ok --reference nofastmath --parked migration/corpus/parked_arm64.json || status=1
          fi
          exit $status
      - name: Write the missing macOS hash entries (new keys only)
        id: write
        if: ${{ !cancelled() }}
        run: |
          python3 migration/scripts/run_corpus.py hashes build/platform/pinned --write --only-new \
            --parked migration/corpus/parked_arm64.json
          if [ -d build/platform/proxy ]; then
            python3 migration/scripts/run_corpus.py hashes build/platform/proxy --write --only-new \
              --reference nofastmath --parked migration/corpus/parked_arm64.json
          fi
          mkdir -p build/macos-hashes
          git diff -- migration/corpus > build/macos-hashes/macos-hashes.patch
          if [ -s build/macos-hashes/macos-hashes.patch ]; then
            echo "written=true" >> "$GITHUB_OUTPUT"
            files=$(git diff --name-only -- migration/corpus | tr '\n' ' ')
            echo "::warning::New cases have no macOS hashes yet: ${files}. Apply them with migration/scripts/macos_hashes.sh ${{ github.run_id }}"
            {
              echo "### macOS hash entries for new cases"
              echo
              echo "Commit them in this PR (new keys only; existing hashes are never changed):"
              echo
              echo '```bash'
              echo "migration/scripts/macos_hashes.sh ${{ github.run_id }}"
              echo '```'
              echo
              git diff --stat -- migration/corpus
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the macOS hash patch
        if: ${{ !cancelled() && steps.write.outputs.written == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-hashes
          path: build/macos-hashes/
          retention-days: 14
      - name: Upload parity failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-failures-arm64-macos
          path: build/parity-failures/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ref-arm64-macos-15
          path: |
            build/platform/pinned/
            build/platform/proxy/
            migration/reference/build/ref-render
            migration/reference/build/ref-module
          if-no-files-found: error
          retention-days: 7
