[package]
name = "audio-diff"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Compare a port render against a reference render: max abs error, RMS dB difference, spectral distance, tolerances, pass/fail exit code."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "audio-diff"
path = "src/main.rs"

[dependencies]
hound = "3.5"
rustfft = "6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
